[package]
name = "telemetry-adapter-contracts"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "macros"] }

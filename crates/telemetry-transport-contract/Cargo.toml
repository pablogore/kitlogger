[package]
name = "telemetry-transport-contract"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
context-propagation = { path = "../context-propagation" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
serde_test = "1.0"
tokio = { version = "1.0", features = ["rt", "macros"] }
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"

[lib]
name = "telemetry_transport_contract"
path = "src/lib.rs"

[package]
name = "telemetry-transport-contract"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
fastrand = "2.4"
kit-config = { path = "../../../kit-config/crates/kit-config", default-features = false, features = ["logging"] }
telemetry-types = { path = "../telemetry-types" }

[dev-dependencies]
serde_test = "1.0"
tokio = { version = "1.0", features = ["rt", "macros"] }
uuid = { version = "1.0", features = ["v4"] }
async-trait = "0.1"

[lib]
name = "telemetry_transport_contract"
path = "src/lib.rs"

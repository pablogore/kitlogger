schema: spec-driven

context: |
  Tech stack: Rust edition 2021, Cargo workspace with 10 crates
  Architecture: Clean/Hexagonal, crate-per-domain, telemetry focused
  Configuration: telemetry-transport-contract depends on kit-config (path dep,
    default-features = false, features = ["logging"]) for LoggingConfig and
    the Validation contract, per kit-config's KIT-001 architecture (kit-config
    owns the LoggingConfig domain type; kitlogger consumes it, never defines
    its own competing logging config shape).
  Testing: cargo test (unit + integration), cargo clippy, cargo fmt
  Style: Conventional commits, no AI attribution, SDD with openspec

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns
    tdd: true
    test_command: "cargo test"
  verify:
    test_command: "cargo test"
    build_command: "cargo build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
